<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Book</title>
    <style>
        body { background-color: #FFF8DC; font-family: "Courier New", monospace; text-align: center; color: #003366; }
        form { display: inline-block; margin-top: 50px; background: #FDF5E6; border: 2px solid #003366; border-radius: 8px; padding: 30px; box-shadow: 0 0 10px rgba(0,0,0,0.2); }
        input { display: block; margin: 10px auto; padding: 10px; width: 250px; border: 1px solid #003366; border-radius: 4px; }
        button { background: #003366; color: #fff; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0055aa; }
        a { display: block; margin-top: 20px; text-decoration: none; color: #003366; font-weight: bold; }
    </style>
</head>
<body>
    <h2>➕ Add New Book</h2>
    <form method="POST">
        {% csrf_token %}
        <input type="text" name="title" placeholder="Book Title" required>
        <input type="text" name="author" placeholder="Author" required>
        <input type="text" name="isbn" placeholder="ISBN" required>
        <button type="submit">Add Book</button>
    </form>
    <a href="{% url 'book_list' %}">⬅ Back to Book List</a>
</body>
</html>
